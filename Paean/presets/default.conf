# Default Paean final evaluation with cost-matched controls.

--batch-size 64
--output-root Paean/outputs
--repeat 50
--random-seed 42
--random
--cost-match-count 50
--cost-match-max-attempts 5000
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.05
--stage2-stability-tolerance 0.05
--stage2-k-trials 5
--stage2-probe-size 256
