# Default independent Paean final eval preset used by training after search.
# Training supplies the just-finished search result; this preset controls
# evaluation repeat counts, random comparison groups, seed, and output root.

--batch-size 64
--output-root Paean/outputs
--repeat 50
--random-seed 42
--random
--perm-trials 10
--cost-trials 10
--budget-trials 10
--stage1-budget-trials 10
--stage2-budget-trials 10
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.05
--stage2-stability-tolerance 0.05
--stage2-k-trials 5
--stage2-probe-size 256
