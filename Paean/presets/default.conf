# Default independent Paean final eval preset used by training after search.
# Training supplies the just-finished search result; this preset controls
# evaluation repeat counts, random comparison groups, seed, output root, and
# whether a GLUE submission zip is auto-generated for the BLB action.
#
# --cost-match-count = 50 cost-matched random configs (same total_bits,
# total_fusion_count, sum_truncation_k as the selected BLB action) are
# evaluated alongside the selected action so the report shows a same-cost
# baseline distribution. --glue-submission turns on the post-final-eval
# GLUE TSV/zip generation; pass --no-glue-submission for quick runs.

--batch-size 64
--output-root Paean/outputs
--repeat 50
--random-seed 42
--random
--cost-match-count 50
--cost-match-max-attempts 5000
--glue-submission
--glue-submission-seed 42
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.05
--stage2-stability-tolerance 0.05
--stage2-k-trials 5
--stage2-probe-size 256
