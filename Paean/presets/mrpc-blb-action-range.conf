# MRPC standalone BLB action-grid final-eval.
# This evaluates 4x2 selected action configs and does not run random groups.

--dataset mrpc
--algorithm rl
--model-type bert-base
--batch-size 64
--logfile blb_action_range_final_eval.log
--stage2-rl-variant blb_v3
--source json
--config glue_final_configs_best_ppo.json
--output-root Paean/outputs
--repeat 50
--random-seed 42
--range truncation=6,7,8,9,10,11,12,13
--range wffn1=18,20
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.005
--stage2-stability-tolerance 0.005
--stage2-k-trials 5
--stage2-probe-size 256
