# MRPC BLB final-eval: BLB baseline non-truncation settings + truncation K sweep.
# Runs validation_full, 50 repeated evaluations per selected configuration.
# Requires the real Rescale_optimizer in-process invoker.

--dataset mrpc
--algorithm rl
--model-type bert-base
--batch-size 64
--logfile blb_baseline_truncation_sweep_final_eval.log
--stage2-rl-variant blb_v3
--source json
--config glue_final_configs_best_ppo.json
--output-root Paean/outputs
--run-name mrpc_blb_baseline_truncation_sweep
--repeat 50
--random-seed 42
--action-config Paean/action_configs/mrpc-blb-baseline-truncation-6-13.json
--rescale-invoker-kind in_process
--rescale-optimizer-root Rescale_optimizer
--require-rescale-optimizer
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.005
--stage2-stability-tolerance 0.005
--stage2-k-trials 5
--stage2-probe-size 256
