# MRPC standalone BLB max-action final-eval.
# Evaluates the action-space max baseline. With --random it also generates
# --cost-match-count cost-matched random BLB configs and reports the same-cost
# distribution alongside.

--dataset mrpc
--algorithm rl
--model-type bert-base
--batch-size 64
--logfile blb_max_final_eval.log
--stage2-rl-variant blb_v3
--source blb-max
--config glue_final_configs_best_ppo.json
--output-root Paean/outputs
--repeat 50
--random-seed 42
--random
--cost-match-count 50
--cost-match-max-attempts 5000
--glue-submission
--glue-submission-seed 42
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.005
--stage2-stability-tolerance 0.005
--stage2-k-trials 5
--stage2-probe-size 256
