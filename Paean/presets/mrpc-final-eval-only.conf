# MRPC standalone final-eval from the merged PPO JSON config.

--dataset mrpc
--algorithm rl
--model-type bert-base
--batch-size 64
--logfile final_eval_only.log
--source json
--config glue_final_configs_best_ppo.json
--output-root Paean/outputs
--repeat 50
--random-seed 42
--perm-trials 0
--cost-trials 0
--budget-trials 0
--stage1-budget-trials 0
--stage2-budget-trials 0
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.005
--stage2-stability-tolerance 0.005
--stage2-k-trials 5
--stage2-probe-size 256
