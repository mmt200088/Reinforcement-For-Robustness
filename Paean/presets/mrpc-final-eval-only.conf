# MRPC final evaluation with cost-matched controls.

--dataset mrpc
--algorithm rl
--model-type bert-base
--batch-size 64
--logfile final_eval_only.log
--source json
--config glue_final_configs_best_ppo.json
--output-root Paean/outputs
--repeat 50
--random-seed 42
--random
--cost-match-count 50
--cost-match-max-attempts 5000
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.005
--stage2-stability-tolerance 0.005
--stage2-k-trials 5
--stage2-probe-size 256
