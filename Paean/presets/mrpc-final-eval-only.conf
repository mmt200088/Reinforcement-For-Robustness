# MRPC standalone final-eval from the merged PPO JSON config.
# This preset runs the BLB final-eval against the selected action (or against
# an --action-config the user passes on the CLI). With --random it ALSO draws
# --cost-match-count cost-matched random BLB configs and reports both groups
# side by side; without --random only the selected action is evaluated.

--dataset mrpc
--algorithm rl
--model-type bert-base
--batch-size 64
--logfile final_eval_only.log
--source json
--config glue_final_configs_best_ppo.json
--output-root Paean/outputs
--repeat 50
--random-seed 42
--random
--cost-match-count 50
--cost-match-max-attempts 5000
--glue-submission
--glue-submission-seed 42
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.005
--stage2-stability-tolerance 0.005
--stage2-k-trials 5
--stage2-probe-size 256
