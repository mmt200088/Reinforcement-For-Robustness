[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reinforcement-for-robustness"
version = "0.1.0"
description = "Search efficient approximation and MPC configurations for privacy-preserving BERT inference"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "Proprietary - research use only" }
keywords = [
    "privacy-preserving-inference", "CKKS", "MPC", "BERT",
    "reinforcement-learning", "PPO", "noise-search",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "torch>=2.0,<3.0",
    "transformers==4.44.2",
    "datasets>=2.10",
    "numpy>=1.22,<2.0",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "fire>=0.5",
    "tqdm>=4.65",
    "accelerate>=0.20",
    "safetensors>=0.3",
    "evaluate>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rfr*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "configs/preparation/rescale",
    "local_assets",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",
    "E731",
    "ANN",
    "UP006", "UP007", "UP035",
    "B023",
    "B011",
    "SIM117",
    "RUF012",
]
allowed-confusables = ["’", "‘"]

[tool.ruff.lint.per-file-ignores]
"src/rfr/search/common/evaluator.py" = ["F401", "F811", "F841", "E402", "E741", "F403"]
"src/rfr/cli/run.py" = ["F841", "E402"]
".github/*" = ["ALL"]
"scripts/*" = ["F401", "F841"]
"src/rfr/preparation/rescale/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["rfr"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
