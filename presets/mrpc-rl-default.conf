# MRPC 默认 RL 搜索预设
# 用法: bash llama_7B_LayerImportance.sh --preset mrpc-rl-default [--fresh-start]

--dataset mrpc
--search-algorithm rl
--model-type bert-base
--batch-size 16
--stage1-search-episodes 51000
--stage2-search-episodes 80000
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.05
--stage2-stability-tolerance 0.05
