# MRPC default RL preset
# Usage: bash llama_7B_LayerImportance.sh --preset mrpc-rl-default

--dataset mrpc
--search-algorithm rl
--model-type bert-base
--batch-size 64
--logfile output.log
--stage1-search-episodes 51000
--stage2-search-episodes 80000
--stage1-search-lr 2e-5
--stage2-search-lr 2e-5
--ppo-update-interval 120
--skip-stage1-search
--final-eval-source search
--final-eval-config glue_final_configs_best_ppo.json
--stage2-fixed-config-source json
--stage2-fixed-config glue_final_configs_best_ppo.json
--final-eval-repeat 1
--random-seed 42
--perm-trials 50
--cost-trials 50
--budget-trials 50
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.005
--stage2-stability-tolerance 0.005
--stage2-k-trials 5
--stage2-probe-size 256
--fresh-start
--fresh-stage1
--fresh-stage2
