# MRPC BLB Stage-2 RL preset · 12-step layerwise robust PPO
# ==========================================================================
# 每个 episode 按 Transformer 层决策 12 步：Block4 fusion 0/1，以及
# Block1/2/3/4/5 truncation K；Block2/5 fusion 固定为 1。
#
# Remote usage:
#   First run:  bash llama_7B_LayerImportance.sh run rl --preset mrpc-blb-stage2-rl --fresh
#   Resume:     bash llama_7B_LayerImportance.sh run rl --preset mrpc-blb-stage2-rl
#
# 想跑旧的 single-shot（horizon=1, 577-dim 一次性出全部动作）：
#   bash llama_7B_LayerImportance.sh run rl --preset mrpc-blb-stage2-rl --fresh \
#       --blb-v3-no-sequential-rl --stage2-search-episodes 600
#
# Keep --fresh / --fresh-stage1 / --fresh-stage2 outside this preset so the
# same preset can be reused safely for automatic resume.

--dataset mrpc
--search-algorithm rl
--model-type bert-base
--batch-size 64
--logfile blb_stage2_rl.log
# 持久化根目录保留默认值（Parting Chapter/persistent）—— 与历史 RL/GA/general 输出
# 共用同一棵树，compare / experiments_log 才能同时聚合三条线产物。
# 如需切到其他根目录，在命令行加 --persistent-root PATH 覆盖即可。

# ---------------------------------------------------------------------------
# Search budget
# ---------------------------------------------------------------------------
# 解耦后（2026-06-01）：用 --mode stage2-only。它隐含跳过 Stage-1 搜索（不要再加
# --skip-stage1-search，否则启动器报冲突）。
# 2026-06-25 起，正式 Stage-2 RL 输出写到
# Parting Chapter/persistent/rl/{model}/{dataset}/{constraint_slug}/stage2_noise/progress/。
# 前置 Stage-1 (gelu/softmax) 建议用 --stage2-fixed-config-source json/manual 显式指定；
# 如需覆盖当前 PPO 最优配置，在命令行加 --stage2-fixed-config PATH。
--mode stage2-only

# Stage-2 layerwise robust：
#   * 每个 episode 12 步，逐层决策 Block4 fusion 与 B1..B5 K。
#   * PPO 每 120 个 episode 更新一次；0 表示不设固定 episode 上限。
#   * Block4/K 双熵 <0.1、存在可靠可行候选且前沿 100 次 update 无改进后停止。
#   * 熵只用于观测和停止，PPO 目标中的 ent_coef 永久为 0。
#   * checkpoint 每 200 episode 触发一次周期报告；每次 PPO update 都提交
#     policy、candidate evidence 与主/镜像 JSONL 的一致断点。
--stage2-search-episodes 0
--stage2-rollout-size 120
--stage2-save-interval 200
--stage2-eval-interval 100
--stage2-calibrate-baseline-samples 8
--stage2-search-lr 5e-5

# ---------------------------------------------------------------------------
# Layerwise robust PPO knobs（六通道 bootstrap 约束；first_input 并入 layer 0）
# ---------------------------------------------------------------------------
# Invalid penalty：每个 invalid 子动作发负奖励。设 1.0 是 cost_shaping 的 ~20×，
# 已足够让 PPO 在 ~10 个 episode 内学会避免 invalid block。
--blb-v3-sequential-rl true
--blb-v3-fusion-count-action true
--blb-v3-decision-granularity layer
--blb-v3-reward-design robust_constrained
--blb-v3-substage-mode false
--blb-v3-sequential-invalid-penalty 1.0
--blb-v3-sequential-cost-shaping-coeff 0.0
--blb-v3-sequential-fusion-shaping-coeff 0.0
# early_terminate_on_invalid=false：保留学习"从坏决策中恢复"的机会，更稳。

# Stage-1 配置来源：解耦后默认读 Parting Chapter/stage1/record/（见上方 --mode stage2-only
# 注释）。不再在预设里写死 JSON；需要显式覆盖时在命令行加 --stage2-fixed-config PATH。

# ---------------------------------------------------------------------------
# BLB v3 warmstart (disabled by default)
# ---------------------------------------------------------------------------
# Stage-1-aligned Stage-2 runs do not force baseline-anchor episodes by
# default. Add --blb-v3-warmstart-anchor-episodes N explicitly only for a
# debugging/A-B run that is meant to use the legacy warmstart scaffold.

# ---------------------------------------------------------------------------
# Final evaluation
# ---------------------------------------------------------------------------
# UnifiedFinalEvaluationModule 检测到 result['blb_v3_best_action_vec'] 后
# 自动走 BLBActionFinalEvaluationModule，安装 RL 最优 action vec 做完整 eval。
--final-eval-preset default
--final-eval-source search
--final-eval-config glue_final_configs_best_ppo.json
--final-eval-repeat 1
--random-seed 42
--perm-trials 0
--cost-trials 0
--budget-trials 0

# ---------------------------------------------------------------------------
# Constraints
# ---------------------------------------------------------------------------
# 当前正式 Stage-2 自然收敛 spec：精度约束 0.1%，稳定性约束 200%。
--stage1-accuracy-tolerance 0.001
--stage2-limit-tolerance 0.001
--stage2-stability-multiplier 2.0
--stage2-k-trials 5
--stage2-probe-size 256
--blb-v3-online-k-trials 5
--blb-v3-baseline-groups 5
--blb-v3-baseline-trials-per-group 5
--blb-v3-constraint-bootstrap-samples 4096
--blb-v3-online-constraint-probability 0.50
--blb-v3-promotion-constraint-probability 0.80
--blb-v3-final-constraint-probability 0.95
--blb-v3-promotion-validation-trials 25
--blb-v3-final-selection-validation-trials 25
