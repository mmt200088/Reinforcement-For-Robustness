# MRPC BLB Stage-2 RL preset.
# Remote usage:
#   First run:  bash llama_7B_LayerImportance.sh run rl --preset mrpc-blb-stage2-rl --fresh
#   Resume:     bash llama_7B_LayerImportance.sh run rl --preset mrpc-blb-stage2-rl
#
# Keep --fresh / --fresh-stage1 / --fresh-stage2 outside this preset so the same
# preset can be reused safely for automatic resume.

--dataset mrpc
--search-algorithm rl
--model-type bert-base
--batch-size 64
--logfile blb_stage2_rl.log

# Search budget.
--stage1-search-episodes 51000
--stage2-search-episodes 80000
--stage1-search-lr 2e-5
--stage2-search-lr 2e-5
--ppo-update-interval 120

# BLB Stage-2 RL implementation.
--stage2-rl-variant blb_v3
--stage2-rollout-size 120
--stage2-save-interval 200
--stage2-eval-interval 100
--stage2-calibrate-baseline-samples 8

# Stage-2 only by default: use the merged final config as fixed Stage-1
# GELU/Softmax source, then let BLB search Stage-2.
--skip-stage1-search
--stage2-fixed-config-source json
--stage2-fixed-config glue_final_configs_best_ppo.json

# Unified final evaluation.
--final-eval-preset default
--final-eval-source search
--final-eval-config glue_final_configs_best_ppo.json
--final-eval-repeat 1
--random-seed 42
--perm-trials 0
--cost-trials 0
--budget-trials 0

# Constraints.
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.005
--stage2-stability-tolerance 0.005
--stage2-k-trials 5
--stage2-probe-size 256
