# BERT-large + SST-2 Stage-1-only RL preset
# Runs ONLY Stage-1 (GTrXL PPO over GELU/Softmax polynomial degrees per layer).
# Stage-2 search and final eval are both skipped, so this preset has no
# Rescale_optimizer or BLB dependency.
#
# bert-large has 24 transformer layers (vs bert-base's 12), so the GTrXL
# policy is correspondingly larger; TransformerOptEnv.total_layers reads from
# the model dynamically, so no extra wiring is needed here.
#
# Usage:
#   First run:  bash llama_7B_LayerImportance.sh run rl --preset bert-large-sst2-stage1-rl --fresh
#   Resume:     bash llama_7B_LayerImportance.sh run rl --preset bert-large-sst2-stage1-rl
#
# Keep --fresh / --fresh-stage1 / --fresh-stage2 outside this preset so the
# same preset can be reused for automatic resume.

--dataset sst2
--search-algorithm rl
--model-type bert-large
--batch-size 512
--logfile stage1_rl.log

--mode stage1-only
--skip-final-eval

--stage1-search-episodes 0
--stage1-entropy-stop-threshold 0.1
--stage1-search-lr 2e-5
--ppo-update-interval 120
--random-seed 42

--stage1-accuracy-tolerance 0.0
