# MRPC BLB Stage-2 RL preset · 4-sub-stage 模式（2026-05-27, 探索性）
# ==========================================================================
# 这个 preset 把 Stage-2 RL 拆成 4 个独立 sub-stage：
#   sub-stage 1 → only block 1 (12 layers × block 1 slots, horizon=11)
#   sub-stage 2 → only block 2 (horizon=12, first_input fresh folded in)
#   sub-stage 3 → only block 4 (horizon=12)
#   sub-stage 4 → only block 5 (horizon=12)
# Block 3 在整个训练过程中固定为 static_skeletons baseline。
#
# 每个 sub-stage 都用一个 FRESH GTrXL policy（不复用上一个 sub-stage 的权重），
# horizon 缩小到 12 让 GTrXL 专注于 "层与层之间" 而不是 "block 与 block 之间"。
#
# 精度 budget 分配采用 "progressive re-baseline"：每个 sub-stage 之间重新
# 测一次 noisy baseline，下一个 sub-stage 的 acc_threshold =
# max(acc_after_prev - tol/N, acc_orig - tol)。前 sub-stage 没用完的精度
# budget 会自动留给后面的 sub-stage；硬下限是 acc_orig - tol，确保最终
# 总精度跌幅不会超过 tolerance。
#
# 每个 sub-stage 训练完之后，会从 top-5 候选里跑 8 次 K-trial promotion
# validation，挑 hard-priority + validated_priority=3 的最佳，传给下个
# sub-stage 当 frozen base。
#
# Remote usage:
#   First run:  bash llama_7B_LayerImportance.sh run rl --preset mrpc-blb-stage2-rl-substage --fresh
#   Resume:     bash llama_7B_LayerImportance.sh run rl --preset mrpc-blb-stage2-rl-substage
#
# 想跑老的 horizon=59 per-block sequential：用 mrpc-blb-stage2-rl preset 即可。

--dataset mrpc
--search-algorithm rl
--model-type bert-base
--batch-size 64
--logfile blb_stage2_rl_substage.log

# ---------------------------------------------------------------------------
# 4-sub-stage 总开关 + 顺序
# ---------------------------------------------------------------------------
--blb-v3-substage-mode true
--blb-v3-substage-block-order 1,2,4,5
--blb-v3-substage-frozen-blocks 3
# 每个 sub-stage 训练 15k episode；总预算 = 4 × 15k = 60k（与现有 60k 持平）
--blb-v3-substage-episodes-each 15000
# Top-5 候选 × 8 trials promotion validation per sub-stage（默认就是 5 / 8）
--blb-v3-substage-promotion-top-k 5
--blb-v3-substage-promotion-trials 8

# ---------------------------------------------------------------------------
# Stage-1 跳过：直接取 final config 的固定 degree
# ---------------------------------------------------------------------------
--skip-stage1-search

# ---------------------------------------------------------------------------
# 训练 schedule（每 sub-stage 内部）
# ---------------------------------------------------------------------------
# stage2-search-episodes 在 substage 模式下不起决定作用（episodes_each 接管），
# 但仍需设值以通过校验。设为单 sub-stage 大小即可。
--stage2-search-episodes 15000
--stage2-rollout-size 60
--stage2-save-interval 200
--stage2-eval-interval 100
--stage2-calibrate-baseline-samples 8
--stage2-search-lr 2e-4

# Sequential RL knobs（substage 模式内部走的也是 train_sequential）
--blb-v3-sequential-rl true
--blb-v3-sequential-invalid-penalty 1.0
--blb-v3-sequential-cost-shaping-coeff 0.05
--blb-v3-sequential-fusion-shaping-coeff 0.0

# Stage-1 配置来源
--stage2-fixed-config-source json
--stage2-fixed-config glue_final_configs_best_ppo.json

# 每 sub-stage anchor 短一点（fresh policy 不需要长 anchor + horizon=12 收敛快）
--blb-v3-warmstart-anchor-episodes 30

# ---------------------------------------------------------------------------
# Final evaluation：UnifiedFinalEvaluationModule 检测到 blb_v3_best_action_vec
# 后会自动走 BLBActionFinalEvaluationModule，包含 GLUE submission。
# ---------------------------------------------------------------------------
--final-eval-preset default
--final-eval-source search
--final-eval-config glue_final_configs_best_ppo.json
--final-eval-repeat 1
--random-seed 42
--perm-trials 0
--cost-trials 0
--budget-trials 0

# ---------------------------------------------------------------------------
# Constraints
# ---------------------------------------------------------------------------
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.005
--stage2-stability-tolerance 0.005
--stage2-k-trials 5
--stage2-probe-size 256
