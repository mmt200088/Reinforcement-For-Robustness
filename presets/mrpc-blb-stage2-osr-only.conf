# MRPC BLB Stage-2 OSR-only preset (2026-05-27, COINN-style pre-prune)
# ==========================================================================
# 这个 preset 不跑 RL，只跑 OSR pre-prune 扫描，并把结果写到
# --blb-v3-osr-results-path 指定的 JSON 路径。之后跑 substage 训练
# preset (mrpc-blb-stage2-rl-substage) 时加 --blb-v3-osr-results-path 同样
# 路径，runner 检测到 fingerprint 匹配会直接 load。
#
# 两层 pre-prune (settled during 2026-05-27 grilling)：
#   Layer 1：对每个 (block, layer, slot, level) 做单 slot baseline-prefix
#            评估（其他 slot 都保持 static_skeletons baseline）。invalid_chain
#            ∨ acc < acc_orig - tol ∨ stab 不达标的 (slot, level) 被打入
#            disabled_cells，运行时不会被采样。
#   Layer 2：对每个 (block, layer) 随机采样 N (默认 300) 个 slot 组合，
#            同样标准评估。失败的 tuple 进 pruned_combos 黑名单。
#
# Block 3 整个 OSR 完全跳过 (在 RL 中 block 3 固定为 baseline，搜索空间为 0)。
# Block 2 单层 57 万亿 combo，所以 Layer 2 必然是采样而非穷举；Forbidden /
# Static / Empirical mask 在训练时仍然存在，作为采样漏取的 safety net。
#
# Usage:
#   # 一台机器上跑 OSR (~10 小时)
#   bash llama_7B_LayerImportance.sh run rl --preset mrpc-blb-stage2-osr-only --fresh \
#       --blb-v3-osr-results-path "Parting Chapter/persistent/rl/bert-base/mrpc/s1t0.005_s2t0.005_s2st0.005/osr_results.json"
#
#   # 另一台 (或同一台) 跑 substage 训练 + 加载 OSR
#   bash llama_7B_LayerImportance.sh run rl --preset mrpc-blb-stage2-rl-substage --fresh \
#       --blb-v3-osr-results-path "Parting Chapter/persistent/rl/bert-base/mrpc/s1t0.005_s2t0.005_s2st0.005/osr_results.json"
#
# fingerprint 包含 (profile, num_layers, stage1_gelu, stage1_softmax, K,
# probe_size, tol_acc, tol_stab, baseline_action_vec_hash, osr_version)。
# 任一变了，load 会 abort；加 --blb-v3-osr-allow-fingerprint-mismatch true
# 可以强行加载但会告警。

--dataset mrpc
--search-algorithm rl
--model-type bert-base
--batch-size 64
--logfile blb_stage2_osr_scan.log

# Stage-1 skip：用 final config 的固定 degree
--skip-stage1-search

# Stage-2 入口仍是 RL runner，但下面的 --blb-v3-osr-scan-only true 会让 runner
# 跑完 OSR 扫描后立即退出（不进入 sub-stage 训练循环）。
--blb-v3-substage-mode true
--blb-v3-osr-scan-only true
--blb-v3-osr-num-combo-samples 300

# Stage-2 训练相关参数不会被实际用到（扫描后退出），但 runner 在初始化 base_env
# 时仍读这些值；保持与训练 preset 一致以确保 fingerprint 命中。
--stage2-search-episodes 1
--stage2-rollout-size 60
--stage2-save-interval 200
--stage2-eval-interval 100
--stage2-calibrate-baseline-samples 8
--stage2-search-lr 2e-4

# Stage-1 配置来源（影响 graph_key per block 3/5）
--stage2-fixed-config-source json
--stage2-fixed-config glue_final_configs_best_ppo.json

# Skip final eval：OSR 扫描结果没必要走 BLB 最终评估
--skip-final-eval

# Constraints（fingerprint 一部分；与训练 preset 必须一致）
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.005
--stage2-stability-tolerance 0.005
--stage2-k-trials 5
--stage2-probe-size 256
