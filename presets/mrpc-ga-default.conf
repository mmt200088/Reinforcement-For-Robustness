# MRPC default GA preset
# Usage: bash llama_7B_LayerImportance.sh --preset mrpc-ga-default

--dataset mrpc
--search-algorithm ga
--model-type bert-base
--batch-size 64
--logfile output.log
--stage2-search-generations 800
--skip-stage1-search
--final-eval-source search
--final-eval-config glue_final_configs_best_genetic.json
--stage2-fixed-config-source json
--stage2-fixed-config glue_final_configs_best_genetic.json
--final-eval-repeat 1
--random-seed 42
--perm-trials 50
--cost-trials 50
--budget-trials 50
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.005
--stage2-stability-tolerance 0.005
--stage2-k-trials 5
--stage2-probe-size 256
--fresh-start
--fresh-stage1
--fresh-stage2
