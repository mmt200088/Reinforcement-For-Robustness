# MRPC · bert-base · RL vs GA 对比（direct：使用仓库根目录 glue 统一 JSON，不读持久化目录）
# 用法: bash llama_7B_LayerImportance.sh --preset mrpc-compare
#
# ── 由 llama_7B_LayerImportance.sh 解析并传给 rl_ga_compare_runner.py 的参数（节选）──
# 模式与数据:
#   --dataset --search-algorithm rl-and-ga-compare --model-type --batch-size
# 对比专用:
#   --compare-config-mode direct|persistent
#   --compare-persistent-root PATH                    (仅 persistent)
#   --rl-compare-stage1-json / --rl-compare-stage2-json
#   --ga-compare-stage1-json / --ga-compare-stage2-json
#   --rl-compare-stage1-accuracy-tolerance 等 6 个    (仅 persistent，定位 rl_results/persistent/.../s1t*_s2t*_s2st*)
# 对比重复次数（重要）:
#   --stage2-compare-repeats N  → rl-and-ga-compare 下控制「统一最终评估」重复次数的正式入口
#   --final-eval-repeat N       → 仅用于普通 --search-algorithm rl 或 ga（见 presets/mrpc-rl-default.conf）
#   二者不要混用：若同时传入，llama_7B_LayerImportance.sh 会报错（见脚本内 rl-and-ga-compare 分支）。
#   compare 流程内部会把 stage2_compare_repeats 传给评估器的 final_eval_repeat_n。
# 全局约束（仅 persistent 可用；direct 下若在预设里写这些，启动脚本会报错退出）:
#   --stage1-accuracy-tolerance --stage2-limit-tolerance --stage2-stability-tolerance
# 最终评估统计:
#   --random-seed --perm-trials --cost-trials --budget-trials
#   --stage2-k-trials --stage2-probe-size
# 仍会传入但对比「仅评估」路径基本不用的占位: --stage1-search-episodes --stage2-search-episodes
#   --stage1-search-generations --stage2-search-generations --stage1-search-lr --stage2-search-lr
#
# ── 仅 python rl_ga_compare_runner.py 支持、当前启动脚本未转发的参数 ──
#   --poll-seconds --python-exe --dry-run
#   --rl-cuda-visible-devices --ga-cuda-visible-devices
#   --rl-skip-stage1-search --ga-skip-stage1-search --rl-skip-noise-search --ga-skip-noise-search
#   --rl-final-eval-source --ga-final-eval-source --rl-final-eval-config --ga-final-eval-config
# 若需要上述参数，请直接调用 rl_ga_compare_runner.py。
#
# ── 本预设采用的取值（请按需改预设或命令行覆盖）──
#   compare-config-mode=direct，RL/GA 各用 glue_final_configs_best_ppo / glue_final_configs_best_genetic
#   （与持久化目录 slug s1t0.005_s2t0.005_s2st0.005 对应的噪声配置一致，见两份 JSON 中 bert-base.mrpc）
#   Stage-2 重复评估 5 次；K=5、probe=256 与常见搜索元数据一致。

--dataset mrpc
--search-algorithm rl-and-ga-compare
--model-type bert-base
--compare-config-mode direct
--rl-compare-stage1-json glue_final_configs_best_ppo.json
--rl-compare-stage2-json glue_final_configs_best_ppo.json
--ga-compare-stage1-json glue_final_configs_best_genetic.json
--ga-compare-stage2-json glue_final_configs_best_genetic.json
--stage2-compare-repeats 50
--batch-size 4

# ── 可选：改为 persistent（用已跑完的 rl_results/persistent/{rl,ga}/bert-base/mrpc/s1t0.005_s2t0.005_s2st0.005/）
# 删除上面 direct 与四个 json 行，改用下面几行（并删掉本注释块外的 direct 段）:
# --compare-config-mode persistent
# --compare-persistent-root rl_results/persistent
# --stage1-accuracy-tolerance 0.005
# --stage2-limit-tolerance 0.005
# --stage2-stability-tolerance 0.005
