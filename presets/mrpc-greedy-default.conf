# MRPC default Greedy preset
# Usage: bash llama_7B_LayerImportance.sh --preset mrpc-greedy-default

--dataset mrpc
--search-algorithm greedy
--model-type bert-base
--batch-size 64
--logfile output.log
--stage1-search-generations 200
--stage2-search-generations 200
--final-eval-source search
--final-eval-config glue_final_configs_best_greedy.json
--stage2-fixed-config-source stage1_result
--final-eval-repeat 1
--random-seed 42
--perm-trials 50
--cost-trials 50
--budget-trials 50
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.005
--stage2-stability-tolerance 0.005
--stage2-k-trials 5
--stage2-probe-size 256
--fresh-start
