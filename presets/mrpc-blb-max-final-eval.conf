# MRPC BLB max-action final-eval preset.
# Remote usage:
#   bash llama_7B_LayerImportance.sh eval --preset mrpc-blb-max-final-eval
#
# This preset is intentionally paired with the eval subcommand, so it does not
# include --skip-stage1-search / --skip-noise-search / --final-eval-only.

--dataset mrpc
--search-algorithm rl
--model-type bert-base
--batch-size 64
--logfile blb_max_final_eval.log

# Evaluate the recommended MRPC Stage-1 GELU/Softmax from JSON, and force
# Stage-2 to the maximum action / maximum scaling-factor configuration.
--stage2-rl-variant blb_v3
--final-eval-source blb-max
--final-eval-config glue_final_configs_best_ppo.json
--final-eval-repeat 50
--random-seed 42

# Disable random comparison groups for this first focused max-action check.
--perm-trials 0
--cost-trials 0
--budget-trials 0
--stage1-budget-trials 0
--stage2-budget-trials 0

# Constraints.
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.005
--stage2-stability-tolerance 0.005
--stage2-k-trials 5
--stage2-probe-size 256
