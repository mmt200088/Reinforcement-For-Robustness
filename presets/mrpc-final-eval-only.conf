# MRPC final-eval-only preset
# Defaults to RL/PPO. For GA or Greedy, override --search-algorithm and --final-eval-config on the command line.

--dataset mrpc
--search-algorithm rl
--model-type bert-base
--batch-size 64
--logfile final_eval_only.log
--skip-stage1-search
--skip-noise-search
--final-eval-only
--final-eval-source search
--final-eval-config glue_final_configs_best_ppo.json
--final-eval-repeat 1
--random-seed 42
--perm-trials 50
--cost-trials 50
--budget-trials 50
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.005
--stage2-stability-tolerance 0.005
--stage2-k-trials 5
--stage2-probe-size 256