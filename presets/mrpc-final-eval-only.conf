# MRPC final-eval-only preset
# Runs only the unified final evaluation from the merged JSON config.
# Non-baseline groups use 50 repeated noisy evaluations for the official mean/std.
# Random comparison families are disabled by default for focused eval.
# Defaults to RL/PPO. For GA, override --search-algorithm and --final-eval-config on the command line.
# To evaluate a previous run's checkpoint/search result instead, override:
#   --final-eval-source search --resume-from <run_dir>

--dataset mrpc
--search-algorithm rl
--model-type bert-base
--batch-size 64
--logfile final_eval_only.log
--skip-stage1-search
--skip-noise-search
--final-eval-only
--final-eval-source json
--final-eval-config glue_final_configs_best_ppo.json
--final-eval-repeat 50
--random-seed 42
--perm-trials 0
--cost-trials 0
--budget-trials 0
--stage1-budget-trials 0
--stage2-budget-trials 0
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.005
--stage2-stability-tolerance 0.005
--stage2-k-trials 5
--stage2-probe-size 256
