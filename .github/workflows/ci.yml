name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel duplicate runs when a branch is pushed quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------
  # Torch-free unit tests (action_space / candidate_store / baseline /
  # diagnostics / action_io). These don't need GPU or transformers, so
  # they run in seconds on a CPU runner and catch the bulk of regressions.
  # ----------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # tests don't need EzPC / LLM-Adapters
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install torch-free deps
        run: |
          python -m pip install --upgrade pip
          # numpy is all the torch-free tests need; deliberately skip torch
          # to keep this job fast (< 30 s) and runable on any worker.
          pip install "numpy>=1.22,<2.0"
      - name: Run torch-free BLB tests
        env:
          BLB_STRICT: "0"   # don't fail on swallowed exceptions during smoke
        run: |
          python -m unittest discover -s tests -p "test_blb_*.py" -v 2>&1 \
            | tee unittest_output.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-log-py${{ matrix.python-version }}
          path: unittest_output.log
          retention-days: 7

  # ----------------------------------------------------------------------
  # Lint: ruff covers ~700 rules including most flake8 / pyflakes / isort.
  # Style is enforced via ruff format (a stricter superset of black).
  # ----------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - name: Install ruff
        run: pip install "ruff>=0.4,<1.0"
      - name: Ruff check
        # `--no-cache` so a flaky cache never masks new errors.
        run: ruff check --no-cache .
      - name: Ruff format check
        run: ruff format --no-cache --check .

  # ----------------------------------------------------------------------
  # Security: scan requirements.txt for known CVEs. Non-blocking for now
  # (continue-on-error) — once the team triages, flip to required.
  # ----------------------------------------------------------------------
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory; tighten once triaged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit requirements.txt
        run: pip-audit --requirement requirements.txt --strict

  # ----------------------------------------------------------------------
  # Documentation sanity: ADR index has a row for each ADR file; HTML guide
  # has balanced tags; CLAUDE.md mentions each new tool.
  # ----------------------------------------------------------------------
  docs-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: ADR index covers every ADR file
        run: |
          python3 - <<'PY'
          import glob, re, sys
          adrs = sorted(glob.glob("docs/adr/ADR-*.md"))
          if not adrs:
              print("no ADR files found"); sys.exit(0)
          index = open("docs/adr/README.md").read()
          missing = []
          for a in adrs:
              # match e.g. "001 |" or "ADR-001"
              num = re.search(r"ADR-(\d{3})", a).group(1)
              if num not in index:
                  missing.append(a)
          if missing:
              print("ADR README index is missing rows for:")
              for m in missing: print("  -", m)
              sys.exit(1)
          print(f"OK: {len(adrs)} ADRs all in index")
          PY
      - name: HTML guide tags balanced
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          class V(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack = []; self.errors = []
              def handle_starttag(self, tag, attrs):
                  if tag in ('br','hr','meta','link','img','input'): return
                  self.stack.append(tag)
              def handle_endtag(self, tag):
                  if tag in ('br','hr','meta','link','img','input'): return
                  if not self.stack or self.stack[-1] != tag:
                      self.errors.append((tag, self.stack[-3:]))
                  else:
                      self.stack.pop()
          import sys
          p = V()
          p.feed(open("reports/session_summary/blb_stage2_rl_guide.html", encoding="utf-8").read())
          if p.stack or p.errors:
              print("unclosed:", p.stack); print("errors:", p.errors); sys.exit(1)
          print("HTML guide: tags balanced")
          PY
