# MRPC BLB Stage-2 RL preset · per-block sequential（自 2026-05-15 起为默认）
# ==========================================================================
# 这个 preset 跑的是 horizon=59 的 per-block sequential RL：每个 episode 59 步，
# 每步只决策一个 (layer, block) 的子动作。详见
# ``reports/session_summary/blb_stage2_rl_guide.html``。
#
# Remote usage:
#   First run:  bash llama_7B_LayerImportance.sh run rl --preset mrpc-blb-stage2-rl --fresh
#   Resume:     bash llama_7B_LayerImportance.sh run rl --preset mrpc-blb-stage2-rl
#
# 想跑旧的 single-shot（horizon=1, 577-dim 一次性出全部动作）：
#   bash llama_7B_LayerImportance.sh run rl --preset mrpc-blb-stage2-rl --fresh \
#       --blb-v3-no-sequential-rl
#
# Keep --fresh / --fresh-stage1 / --fresh-stage2 outside this preset so the
# same preset can be reused safely for automatic resume.

--dataset mrpc
--search-algorithm rl
--model-type bert-base
--batch-size 64
--logfile blb_stage2_rl.log
--persistent-root Paean/outputs

# ---------------------------------------------------------------------------
# Search budget
# ---------------------------------------------------------------------------
# Stage-1 (gelu/softmax degree) 不跑：直接从 final config 取固定 degree。
# 不覆盖 Stage-1 episode；rl_tune.py 在 skip_stage1=True 时要求其保持默认值。
--skip-stage1-search

# Stage-2 per-block sequential：
#   * 每个 episode 59 步，所以 6000 个 episode = 354,000 env.step。
#   * PPO 每 60 个 episode 更新一次 = 总 100 次 PPO update。
#   * checkpoint 每 200 episode 一次（约 33 次磁盘写）。
# 如果服务器算力宽裕想跑更久，把 stage2-search-episodes 调大到 12000+，
# rollout 保持 60 不动。
--stage2-search-episodes 6000
--stage2-rollout-size 60
--stage2-save-interval 200
--stage2-eval-interval 100
--stage2-calibrate-baseline-samples 8
--stage2-search-lr 2e-4

# ---------------------------------------------------------------------------
# Sequential RL knobs（每步密集 reward + 全历史 state；first_input 并入 step0）
# ---------------------------------------------------------------------------
# Invalid penalty：每个 invalid 子动作发负奖励。设 1.0 是 cost_shaping 的 ~20×，
# 已足够让 PPO 在 ~10 个 episode 内学会避免 invalid block。
--blb-v3-sequential-rl true
--blb-v3-sequential-invalid-penalty 1.0
--blb-v3-sequential-cost-shaping-coeff 0.05
--blb-v3-sequential-fusion-shaping-coeff 0.0
# early_terminate_on_invalid=false：保留学习"从坏决策中恢复"的机会，更稳。

# Stage-1 配置来源 (作为 stage-2 RL 的固定 gelu/softmax)
--stage2-fixed-config-source json
--stage2-fixed-config glue_final_configs_best_ppo.json

# ---------------------------------------------------------------------------
# BLB v3 warmstart (per-block all-max baseline anchor)
# ---------------------------------------------------------------------------
# 用 static_skeletons baseline 做 warmstart：policy action head 偏向"largest action
# index"（每个 slot 的 baseline 最大档）。SF 槽 → largest SF；K 槽 → per-block
# baseline K（B1/B3/B5=13，B2/B4=10）。
--blb-v3-warmstart-anchor-episodes 80

# ---------------------------------------------------------------------------
# Final evaluation
# ---------------------------------------------------------------------------
# UnifiedFinalEvaluationModule 检测到 result['blb_v3_best_action_vec'] 后
# 自动走 BLBActionFinalEvaluationModule，安装 RL 最优 action vec 做完整 eval。
--final-eval-preset default
--final-eval-source search
--final-eval-config glue_final_configs_best_ppo.json
--final-eval-repeat 1
--random-seed 42
--perm-trials 0
--cost-trials 0
--budget-trials 0

# ---------------------------------------------------------------------------
# Constraints
# ---------------------------------------------------------------------------
# 在 MRPC 上 ±0.5pp tolerance 通常够用；如果要更严格可降到 0.003。
--stage1-accuracy-tolerance 0.005
--stage2-limit-tolerance 0.005
--stage2-stability-tolerance 0.005
--stage2-k-trials 5
--stage2-probe-size 256
